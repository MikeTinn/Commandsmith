name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No .zip found in the repo. Upload commandsmith-1.21.11.zip first."
            exit 1
          fi
          echo "Unzipping $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project
          find project -maxdepth 3 | head -n 30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: |
          SETTINGS=$(find project -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle found inside the zip."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Building in $DIR"
          cd "$DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: commandsmith
          path: out/*.jar
